name: cloud-tunnel

on:
  workflow_dispatch:
    inputs:
      pubkey:
        description: 'SSH Public Key'
        required: true
        type: string

permissions:
  contents: write

jobs:
  tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq curl jq
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb
      - name: Start HTTP CONNECT proxy
        run: |
          cat > /tmp/proxy.py << 'PYEOF'
import socket, threading, select

def handle_client(client_sock):
    try:
        data = client_sock.recv(4096)
        first_line = data.split(b'\r\n')[0]
        if b'CONNECT' in first_line:
            host_port = first_line.split(b'CONNECT ')[1].split(b' ')[0]
            host, port = host_port.decode().split(':')
            port = int(port)
            try:
                remote = socket.create_connection((host, port), timeout=10)
                client_sock.sendall(b'HTTP/1.1 200 Connection established\r\n\r\n')
                sockets = [client_sock, remote]
                while True:
                    r, _, _ = select.select(sockets, [], [])
                    for s in r:
                        chunk = s.recv(4096)
                        if not chunk:
                            raise ConnectionError
                        if s is client_sock:
                            remote.sendall(chunk)
                        else:
                            client_sock.sendall(chunk)
            except Exception:
                client_sock.sendall(b'HTTP/1.1 502 Bad Gateway\r\n\r\n')
        else:
            # Direct HTTP request proxy
            import urllib.request, ssl
            ctx = ssl.create_default_context()
            ctx.check_hostname = False
            ctx.verify_mode = ssl.CERT_NONE
            try:
                parts = data.split(b' ')
                if len(parts) > 1:
                    url = parts[1].decode()
                    req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                    r = urllib.request.urlopen(req, timeout=10, context=ctx)
                    client_sock.sendall(b'HTTP/1.1 200 OK\r\n\r\n' + r.read())
                else:
                    client_sock.sendall(b'HTTP/1.1 400 Bad Request\r\n\r\n')
            except Exception:
                client_sock.sendall(b'HTTP/1.1 502 Bad Gateway\r\n\r\n')
    except Exception:
        pass
    finally:
        try:
            client_sock.close()
        except:
            pass

server = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
server.bind(('0.0.0.0', 8080))
server.listen(5)
with open('/tmp/proxy_ready.txt', 'w') as f:
    f.write('ready')
while True:
    client, _ = server.accept()
    threading.Thread(target=handle_client, args=(client,)).start()
PYEOF
          python3 /tmp/proxy.py > /tmp/proxy.log 2>&1 &
          echo "Proxy PID: $!"
          sleep 5
      - name: Start cloudflared HTTP tunnel
        run: |
          cloudflared tunnel --url http://localhost:8080 --loglevel info > /tmp/cloudflared.log 2>&1 &
          echo "cloudflared PID: $!"
          sleep 20
      - name: Write tunnel URL to repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TUNNEL_URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 || true)
          echo "TUNNEL_URL=$TUNNEL_URL"
          echo "$TUNNEL_URL" > tunnel-url.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          git add tunnel-url.txt
          git commit -m "Tunnel: $TUNNEL_URL" || true
          git push
      - name: Show tunnel info
        run: |
          cat /tmp/cloudflared.log
      - name: Keep alive
        run: sleep 7200
