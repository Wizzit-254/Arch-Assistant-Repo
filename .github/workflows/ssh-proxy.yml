name: ssh-tunnel

on: push

permissions:
  contents: write

jobs:
  tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq curl openssh-server
          curl -L -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared version
          echo "root:password123" | sudo chpasswd
          sudo mkdir -p /run/sshd
      - name: Start SSH server
        run: |
          sudo /usr/sbin/sshd -p 2222 -o "PasswordAuthentication=yes" -o "PubkeyAuthentication=yes" -o "PermitRootLogin=yes"
          sleep 3
          echo "SSH started on port 2222"
          ps aux | grep sshd
      - name: Start cloudflared tunnel
        run: |
          setsid cloudflared tunnel --url ssh://localhost:2222 --loglevel info > /tmp/cf.log 2>&1 < /dev/null &
          sleep 15
          cat /tmp/cf.log
      - name: Commit URL
        run: |
          TUNNEL_URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
          echo "URL=$TUNNEL_URL"
          echo "$TUNNEL_URL" > tunnel-url.txt
          git config user.name "github-actions[bot]"
          git config user.email "a@b.c"
          git add tunnel-url.txt
          git commit -m "URL: $TUNNEL_URL" || true
          git push
      - name: Wait
        run: sleep 7200
