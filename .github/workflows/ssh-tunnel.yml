name: ssh-tunnel

on:
  workflow_dispatch:
    inputs:
      pubkey:
        description: 'SSH Public Key'
        required: true
        type: string

jobs:
  tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server socat curl jq
          sudo mkdir -p /run/sshd
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ github.event.inputs.pubkey }}" > ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          ssh-keygen -A
      - name: Start SSH server on 2222
        run: |
          sudo /usr/sbin/sshd -p 2222 -o "PasswordAuthentication=no" -o "PubkeyAuthentication=yes" -o "AllowTcpForwarding=yes" -o "GatewayPorts=yes" -o "PermitTunnel=yes" -o "PidFile=/tmp/sshd.pid"
      - name: Start cloudflared tunnel
        run: |
          cloudflared tunnel --url ssh://localhost:2222 --loglevel info > /tmp/cloudflared.log 2>&1 &
          echo "cloudflared PID: $!"
          sleep 15
      - name: Write tunnel URL to repo
        run: |
          # Extract the trycloudflare.com URL from cloudflared log
          TUNNEL_URL=$(grep -oP 'https://[a-f0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log || true)
          if [ -z "$TUNNEL_URL" ]; then
            TUNNEL_URL=$(grep -oP '\b[a-f0-9-]+\.trycloudflare\.com\b' /tmp/cloudflared.log || true)
            [ -n "$TUNNEL_URL" ] && TUNNEL_URL="https://$TUNNEL_URL"
          fi
          echo "TUNNEL_URL=$TUNNEL_URL"
          echo "$TUNNEL_URL" > /tmp/tunnel_url.txt
          # Write to repo for external reading
          echo "TUNNEL_URL=$TUNNEL_URL" >> /tmp/tunnel_output
          echo "::set-output name=tunnel_url::$TUNNEL_URL"
      - name: Upload tunnel info
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-info
          path: /tmp/cloudflared.log
          if-no-files-found: warn
      - name: Wait for tunnel
        run: sleep 900
