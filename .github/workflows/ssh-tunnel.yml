name: ssh-tunnel

on:
  workflow_dispatch:
    inputs:
      pubkey:
        description: 'SSH Public Key'
        required: true
        type: string

permissions:
  contents: write

jobs:
  tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server socat curl jq
          sudo mkdir -p /run/sshd
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ github.event.inputs.pubkey }}" > ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          ssh-keygen -A
      - name: Start SSH server on 2222
        run: |
          sudo /usr/sbin/sshd -p 2222 -o "PasswordAuthentication=no" -o "PubkeyAuthentication=yes" -o "AllowTcpForwarding=yes" -o "GatewayPorts=yes" -o "PermitTunnel=yes" -o "PidFile=/tmp/sshd.pid"
      - name: Start cloudflared SSH tunnel
        run: |
          cloudflared tunnel --url ssh://localhost:2222 --loglevel info > /tmp/cloudflared.log 2>&1 &
          echo "cloudflared PID: $!"
          sleep 20
      - name: Write tunnel URL to repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TUNNEL_URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 || true)
          echo "TUNNEL_URL=$TUNNEL_URL"
          echo "$TUNNEL_URL" > tunnel-url.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          git add tunnel-url.txt
          git commit -m "Update tunnel URL: $TUNNEL_URL" || true
          git push
      - name: Show tunnel info
        run: |
          cat /tmp/cloudflared.log
      - name: Keep alive
        run: sleep 3600
