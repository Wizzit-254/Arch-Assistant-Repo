name: proxy

on: push

permissions:
  contents: write

jobs:
  tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install cloudflared
        run: |
          curl -L -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared version
      - name: Start HTTP proxy with CONNECT support
        run: |
          cat > /tmp/proxy.py << 'PYEOF'
import socket, threading, select

def handle_client(client):
    try:
        client.settimeout(5)
        data = b''
        while b'\r\n\r\n' not in data:
            chunk = client.recv(4096)
            if not chunk:
                return
            data += chunk
            if len(data) > 8192:
                break
        first_line = data.split(b'\r\n')[0].decode('utf-8', errors='replace')
        parts = first_line.split()
        if len(parts) >= 2 and parts[0].upper() == 'CONNECT':
            host_port = parts[1]
            host, port = host_port.rsplit(':', 1)
            port = int(port)
            try:
                remote = socket.create_connection((host, port), timeout=15)
                client.sendall(b'HTTP/1.1 200 Connection established\r\n\r\n')
                client.settimeout(None)
                socks = [client, remote]
                while True:
                    r, _, _ = select.select(socks, [], [])
                    for s in r:
                        chunk = s.recv(4096)
                        if not chunk:
                            return
                        if s is client:
                            remote.sendall(chunk)
                        else:
                            client.sendall(chunk)
            except Exception as e:
                try:
                    client.sendall(b'HTTP/1.1 502 Bad Gateway\r\n\r\n' + str(e).encode())
                except:
                    pass
        else:
            try:
                if parts[0].upper() == 'GET':
                    url = parts[1]
                    if url.startswith('http://'):
                        host = url.split('/')[2]
                    else:
                        host = '127.0.0.1'
                    port = 80
                    remote = socket.create_connection((host, port), timeout=15)
                    remote.sendall(data)
                    socks = [client, remote]
                    while True:
                        r, _, _ = select.select(socks, [], [])
                        for s in r:
                            chunk = s.recv(4096)
                            if not chunk:
                                return
                            if s is client:
                                remote.sendall(chunk)
                            else:
                                client.sendall(chunk)
            except Exception as e:
                try:
                    client.sendall(b'HTTP/1.1 502 Bad Gateway\r\n\r\n' + str(e).encode())
                except:
                    pass
    except:
        pass
    finally:
        try: client.close()
        except: pass

srv = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
srv.bind(('0.0.0.0', 8888))
srv.listen(5)
while True:
    c, _ = srv.accept()
    threading.Thread(target=handle_client, args=(c,)).start()
PYEOF
          python3 /tmp/proxy.py > /tmp/proxy.log 2>&1 &
          sleep 3
      - name: Start cloudflared tunnel
        run: |
          cloudflared tunnel --url http://localhost:8888 > /tmp/cf.log 2>&1 &
          sleep 15
          cat /tmp/cf.log
      - name: Commit URL
        run: |
          TUNNEL_URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
          echo "URL=$TUNNEL_URL"
          echo "$TUNNEL_URL" > tunnel-url.txt
          git config user.name "github-actions[bot]"
          git config user.email "a@b.c"
          git add tunnel-url.txt
          git commit -m "URL: $TUNNEL_URL" || true
          git push
      - name: Wait
        run: sleep 7200
