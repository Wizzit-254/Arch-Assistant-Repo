name: proxy

on:
  push:
    paths:
      - 'tunnel-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install cloudflared
        run: |
          curl -L -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared version
      - name: Start simple test server
        run: |
          python3 -m http.server 8888 --bind 0.0.0.0 > /tmp/http.log 2>&1 &
          sleep 3
          echo "HTTP server started"
      - name: Start cloudflared tunnel
        run: |
          cloudflared tunnel --url http://localhost:8888 > /tmp/cf.log 2>&1 &
          sleep 15
          cat /tmp/cf.log
      - name: Write URL
        run: |
          TUNNEL_URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
          echo "URL=$TUNNEL_URL"
          echo "$TUNNEL_URL" > tunnel-url.txt
          git config user.name "github-actions[bot]"
          git config user.email "a@b.c"
          git add tunnel-url.txt
          git commit -m "URL: $TUNNEL_URL" || true
          git push
      - name: Wait
        run: sleep 7200
