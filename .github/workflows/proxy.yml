name: socks-tunnel

on: push

permissions:
  contents: write

jobs:
  tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install cloudflared
        run: |
          echo "Installing cloudflared"
          curl -L -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared version
      - name: Start SOCKS5 proxy via cloudflared
        run: |
          setsid bash -c 'cloudflared tunnel --socks5 --url socks5://localhost:1080 --loglevel info > /tmp/cf.log 2>&1' < /dev/null &
          sleep 20
          cat /tmp/cf.log
          echo "=== Processes ==="
          ps aux | grep cloudflared
      - name: Commit URL
        run: |
          TUNNEL_URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
          echo "URL=$TUNNEL_URL"
          echo "$TUNNEL_URL" > tunnel-url.txt
          git config user.name "github-actions[bot]"
          git config user.email "a@b.c"
          git add tunnel-url.txt
          git commit -m "URL: $TUNNEL_URL" || true
          git push --force
      - name: Keep alive
        run: sleep 7200
